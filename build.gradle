// Spring Bootアプリの実行・依存関係管理とJavaプラグインを適用する
plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.200okmk'
version = '0.0.1-SNAPSHOT'

// JavaのコンパイルとツールチェーンにJava 21を要求する
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// アプリケーションとテストで使用するライブラリを取得するリポジトリ
repositories {
	mavenCentral()
}

// アプリ本体で使用するWeb、JPA、入力検証、PostgreSQL関連の依存関係
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	// テスト用Spring Boot連携、JUnit/Testcontainers、PostgreSQLコンテナの依存関係
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// JUnit Platform上でJUnit 5のテストを実行する
tasks.named('test') {
	useJUnitPlatform()
}

// 日本語のJavadocをUTF-8で生成し、チームがローカルで参照できる公開API文書として整える
tasks.named('javadoc') {
	// ソースの読み込み・HTML出力の双方をUTF-8に固定し、環境依存の文字化けを防ぐ
	options.encoding = 'UTF-8'
	options.docEncoding = 'UTF-8'
	options.charSet = 'UTF-8'
	// 目次や「前へ/次へ」などの標準文言を日本語で生成する
	options.locale = 'ja_JP'
	options.windowTitle = 'api_todo API'
	options.docTitle = 'api_todo API ドキュメント'
	// 生成時刻を埋め込まず、再生成時の差分を内容の変更だけに抑える
	options.addBooleanOption('notimestamp', true)
	// 構文・参照・HTMLなどは検査し、getter等への定型コメント不足のみ除外して警告ノイズを抑える
	options.addStringOption('Xdoclint:all,-missing', '-quiet')
}
