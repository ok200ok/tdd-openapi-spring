services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: api_todo
      POSTGRES_USER: api_todo
      POSTGRES_PASSWORD: api_todo_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_todo -d api_todo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
